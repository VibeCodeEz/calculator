<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scientific Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <div class="calculator-header">
      <h2>Scientific Calculator</h2>
      <div class="theme-toggle">
        <span>Theme:</span>
        <button id="theme-dark" class="theme-btn active">Dark</button>
        <button id="theme-light" class="theme-btn">Light</button>
      </div>
    </div>
    
    <div class="display-container">
      <div id="history" class="history"></div>
      <input type="text" id="display" disabled />
    </div>

    <div class="mode-selector">
      <button id="basic-mode" class="mode-btn active">Basic</button>
      <button id="scientific-mode" class="mode-btn">Scientific</button>
    </div>
    
    <div class="buttons">
      <!-- Basic Calculator Buttons -->
      <div id="basic-buttons" class="button-panel active">
        <button class="btn memory" onclick="memoryClear()">MC</button>
        <button class="btn memory" onclick="memoryRecall()">MR</button>
        <button class="btn memory" onclick="memoryAdd()">M+</button>
        <button class="btn memory" onclick="memorySubtract()">M-</button>
        
        <button class="btn clear" onclick="clearDisplay()">C</button>
        <button class="btn clear" onclick="deleteLast()">⌫</button>
        <button class="btn operator" onclick="percentage()">%</button>
        <button class="btn operator" onclick="append('/')">÷</button>
        
        <button class="btn number" onclick="append('7')">7</button>
        <button class="btn number" onclick="append('8')">8</button>
        <button class="btn number" onclick="append('9')">9</button>
        <button class="btn operator" onclick="append('*')">×</button>
        
        <button class="btn number" onclick="append('4')">4</button>
        <button class="btn number" onclick="append('5')">5</button>
        <button class="btn number" onclick="append('6')">6</button>
        <button class="btn operator" onclick="append('-')">−</button>
        
        <button class="btn number" onclick="append('1')">1</button>
        <button class="btn number" onclick="append('2')">2</button>
        <button class="btn number" onclick="append('3')">3</button>
        <button class="btn operator" onclick="append('+')">+</button>
        
        <button class="btn number" onclick="toggleSign()">±</button>
        <button class="btn number" onclick="append('0')">0</button>
        <button class="btn number" onclick="append('.')">.</button>
        <button class="btn equals" onclick="calculate()">=</button>
      </div>
      
      <!-- Scientific Calculator Buttons -->
      <div id="scientific-buttons" class="button-panel">
        <button class="btn function" onclick="calculateFunction('sqrt')">√</button>
        <button class="btn function" onclick="calculateFunction('sin')">sin</button>
        <button class="btn function" onclick="calculateFunction('cos')">cos</button>
        <button class="btn function" onclick="calculateFunction('tan')">tan</button>
        
        <button class="btn function" onclick="calculateFunction('x2')">x²</button>
        <button class="btn function" onclick="calculateFunction('asin')">sin⁻¹</button>
        <button class="btn function" onclick="calculateFunction('acos')">cos⁻¹</button>
        <button class="btn function" onclick="calculateFunction('atan')">tan⁻¹</button>
        
        <button class="btn function" onclick="calculateFunction('x3')">x³</button>
        <button class="btn function" onclick="calculateFunction('log')">log</button>
        <button class="btn function" onclick="calculateFunction('ln')">ln</button>
        <button class="btn operator" onclick="append('**')">^</button>
        
        <button class="btn function" onclick="calculateFunction('1/x')">1/x</button>
        <button class="btn function" onclick="append('Math.PI')">π</button>
        <button class="btn function" onclick="append('Math.E')">e</button>
        <button class="btn operator" onclick="append('!')"fac>!</button>
        
        <button class="btn operator" onclick="append('(')">(</button>
        <button class="btn operator" onclick="append(')')">)</button>
        <button class="btn function" onclick="calculateFunction('abs')">|x|</button>
        <button class="btn function" onclick="calculateFunction('10^x')">10^x</button>
      </div>
    </div>
    
    <div class="calculator-footer">
      <div id="memory-indicator" class="hidden">M</div>
      <div class="degree-mode">
        <button id="rad-mode" class="degree-btn active">RAD</button>
        <button id="deg-mode" class="degree-btn">DEG</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
